      # Runs exactly the gates AGENTS.md declares in its fleet-gates block, so the
      # contract's gate list is executable rather than prose. Byte-identical in
      # every fleet repository with CI; the conformance checker compares it.
      - name: Run declared gates
        run: |
          gates=$(awk '/^```fleet-gates$/{o=1;next} o&&/^```$/{o=0;next} o&&/^gate: /{sub(/^gate: /,"");print}' AGENTS.md)
          [ -n "$gates" ] || { echo "AGENTS.md declares no gate: entry in its fleet-gates block" >&2; exit 1; }
          n=0
          while IFS= read -r gate; do
            [ -n "$gate" ] || continue
            echo "::group::$gate"
            sh -c "$gate"
            echo "::endgroup::"
            n=$((n + 1))
          done <<< "$gates"
          echo "$n declared gate(s) executed."
