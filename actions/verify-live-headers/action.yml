name: Verify live security headers
description: Probe a production HTTPS origin for the fleet's seven required response headers.

inputs:
  url:
    description: Literal production HTTPS origin to probe.
    required: true

runs:
  using: composite
  steps:
    - name: Assert the seven security headers on production
      # The calling workflow controls job environment and every earlier step.
      # Neutralize shell startup hooks before Bash starts, then run the probe
      # with an allowlisted environment and private curl/temp state. Otherwise
      # BASH_ENV, PATH, proxy variables, or a caller-written curlrc could forge
      # the required header gate while it reports success.
      shell: /bin/bash --noprofile --norc -euo pipefail {0}
      env:
        BASHOPTS: ""
        BASH_COMPAT: ""
        BASH_ENV: /dev/null
        BASH_LOADABLES_PATH: ""
        CDPATH: ""
        CURL_HOME: ""
        DYLD_FALLBACK_FRAMEWORK_PATH: ""
        DYLD_FALLBACK_LIBRARY_PATH: ""
        DYLD_FRAMEWORK_PATH: ""
        DYLD_IMAGE_SUFFIX: ""
        DYLD_INSERT_LIBRARIES: ""
        DYLD_LIBRARY_PATH: ""
        DYLD_PRINT_TO_FILE: ""
        DYLD_ROOT_PATH: ""
        ENV: /dev/null
        GLOBIGNORE: ""
        LD_AUDIT: ""
        LD_DEBUG: ""
        LD_DEBUG_OUTPUT: ""
        LD_LIBRARY_PATH: ""
        LD_ORIGIN_PATH: ""
        LD_PRELOAD: ""
        LD_PROFILE: ""
        PS4: ""
        SHELLOPTS: ""
        TARGET_URL: ${{ inputs.url }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        XDG_CONFIG_HOME: ""
      run: |
        unset LD_SHOW_AUXV
        probe_root=$(/usr/bin/mktemp -d "${RUNNER_TEMP:?RUNNER_TEMP is required}/fleet-live-headers.XXXXXX")
        trap '/bin/rm -rf -- "$probe_root"' EXIT
        probe_home="$probe_root/home"
        probe_tmp="$probe_root/tmp"
        /bin/mkdir -p "$probe_home" "$probe_tmp"
        /usr/bin/env -i \
          PATH=/usr/bin:/bin \
          LC_ALL=C \
          HOME="$probe_home" \
          TMPDIR="$probe_tmp" \
          HEADER_PROBE_ATTEMPTS=10 \
          HEADER_PROBE_RETRY_DELAY_SECONDS=45 \
          HEADER_PROBE_TIMEOUT_SECONDS=20 \
          /bin/bash --noprofile --norc \
          "$GITHUB_ACTION_PATH/verify-live-headers.sh" \
          "$TARGET_URL" \
          "$GITHUB_EVENT_NAME"
