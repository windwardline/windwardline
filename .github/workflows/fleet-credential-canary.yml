# Does the auto-merge lane's credential still work?
#
# The lane mints a GitHub App installation token and falls back to
# GITHUB_TOKEN if it cannot. That fallback is silent, and the credential is
# only ever exercised when Dependabot happens to open a pull request — so a
# broken App surfaces on a random Monday, in whichever repo Dependabot picked.
# It did, on 2026-08-17: levelflow-cloud returned
# `401 'Issuer' claim ('iss') must be an Integer` (a malformed
# FLEET_AUTOMERGE_APP_ID), and grown-men-grow fell through to GITHUB_TOKEN and
# then 403ed on its own PR. Both had passed every check the fleet had, because
# the conformance checker asserts the secrets are *present* and presence is not
# validity.
#
# This probes the credential on a schedule instead of waiting for Dependabot.
#
# ENABLEMENT (one owner step, then uncomment the schedule below):
#
#   gh secret set FLEET_AUTOMERGE_APP_ID  -R windwardline/windwardline
#   gh secret set FLEET_AUTOMERGE_PRIVATE_KEY -R windwardline/windwardline < key.pem
#
# The `< key.pem` redirect is not a style choice. A multi-line PEM does not
# survive the macOS Keychain round-trip, and the first live run of the lane
# died inside the mint step on `Invalid keyData` because of it. Set a private
# key into a secret straight from the file, never through intermediate storage.
#
# Note these must be **Actions** secrets. The lane's copies are *Dependabot*
# secrets, which are readable only by Dependabot-triggered runs — which is
# exactly why nothing could probe them before now.
name: Fleet credential canary

on:
  workflow_dispatch:
  # Uncomment once the two Actions secrets above exist. Left off deliberately:
  # a canary that is red because it was never configured teaches everyone to
  # ignore the canary.
  # schedule:
  #   - cron: "7 8 * * *"

permissions:
  contents: read

jobs:
  mint:
    name: Mint an installation token per repo
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run unconfigured
        env:
          APP_ID: ${{ secrets.FLEET_AUTOMERGE_APP_ID }}
          KEY: ${{ secrets.FLEET_AUTOMERGE_PRIVATE_KEY }}
        run: |
          # A canary that cannot run must fail, not skip. Skipping is how a
          # required check reports green without having checked anything.
          [ -n "$APP_ID" ] || { echo "::error::FLEET_AUTOMERGE_APP_ID is not set as an Actions secret"; exit 1; }
          [ -n "$KEY" ]    || { echo "::error::FLEET_AUTOMERGE_PRIVATE_KEY is not set as an Actions secret"; exit 1; }
          # Validity, not presence — the levelflow-cloud failure was a secret
          # that existed and was not an integer. Prints nothing about the key.
          case "$APP_ID" in
            ''|*[!0-9]*) echo "::error::FLEET_AUTOMERGE_APP_ID is not an integer — this is the 401 'iss' failure"; exit 1 ;;
          esac
          printf '%s' "$KEY" | head -1 | grep -q 'BEGIN .*PRIVATE KEY' \
            || { echo "::error::FLEET_AUTOMERGE_PRIVATE_KEY is not a PEM — check it was set from the file, not via a shell variable"; exit 1; }
          echo "App ID is an integer; private key carries a PEM header."

      - name: Enumerate the fleet
        id: fleet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repos=$(gh repo list windwardline --limit 200 --json name,isArchived,isTemplate \
                  --jq '[.[] | select(.isArchived|not) | select(.isTemplate|not) | .name] | join(" ")')
          [ -n "$repos" ] || { echo "::error::enumeration returned nothing — refusing to report a vacuous pass"; exit 1; }
          echo "repos=$repos" >> "$GITHUB_OUTPUT"
          echo "Fleet: $repos"

      - name: Mint per repo
        env:
          APP_ID: ${{ secrets.FLEET_AUTOMERGE_APP_ID }}
          KEY: ${{ secrets.FLEET_AUTOMERGE_PRIVATE_KEY }}
          REPOS: ${{ steps.fleet.outputs.repos }}
        run: |
          # A JWT signed with the App key, then one installation lookup per
          # repo. No token is ever printed; only whether one could be obtained.
          python3 - <<'PY'
          import base64, hashlib, json, os, time, urllib.request, sys
          try:
              from cryptography.hazmat.primitives import hashes, serialization
              from cryptography.hazmat.primitives.asymmetric import padding
          except ImportError:
              print("::error::python cryptography unavailable on the runner"); sys.exit(1)

          def b64(d): return base64.urlsafe_b64encode(d).rstrip(b"=")
          key = serialization.load_pem_private_key(os.environ["KEY"].encode(), password=None)
          now = int(time.time())
          hdr = b64(json.dumps({"alg": "RS256", "typ": "JWT"}).encode())
          pay = b64(json.dumps({"iat": now - 60, "exp": now + 540, "iss": os.environ["APP_ID"]}).encode())
          sig = b64(key.sign(hdr + b"." + pay, padding.PKCS1v15(), hashes.SHA256()))
          jwt = (hdr + b"." + pay + b"." + sig).decode()

          def get(url):
              r = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {jwt}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "fleet-credential-canary"})
              return urllib.request.urlopen(r, timeout=20)

          repos = os.environ["REPOS"].split()
          if not repos:
              print("::error::no repos to check"); sys.exit(1)
          bad = []
          for r in repos:
              try:
                  get(f"https://api.github.com/repos/windwardline/{r}/installation")
                  print(f"  ok        {r}")
              except Exception as e:
                  code = getattr(e, "code", "?")
                  reason = "App not installed" if code == 404 else f"HTTP {code}"
                  print(f"  FAIL      {r}: {reason}")
                  bad.append(r)
          print(f"\nExamined {len(repos)} repos, {len(bad)} without a usable installation.")
          if bad:
              print(f"::error::the auto-merge lane has no App token in: {' '.join(bad)}")
              sys.exit(1)
          PY
