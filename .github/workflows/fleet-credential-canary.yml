# Does the auto-merge lane's credential still work?
#
# The lane mints a GitHub App installation token and falls back to
# GITHUB_TOKEN if it cannot. That fallback is silent, and the credential is
# only ever exercised when Dependabot happens to open a pull request — so a
# broken App surfaces on a random Monday, in whichever repo Dependabot picked.
# It did, on 2026-08-17: levelflow-cloud returned
# `401 'Issuer' claim ('iss') must be an Integer` from a malformed
# FLEET_AUTOMERGE_APP_ID. It had passed every check the fleet had, because the
# conformance checker asserts the secrets are present and presence is not
# validity.
#
# This probes the credential on a schedule instead of waiting for Dependabot.
# It mints through the same pinned action the lane uses, rather than signing a
# JWT by hand: one moving part, and it fails the same way the lane would.
name: Fleet credential canary

on:
  workflow_dispatch:
  schedule:
    - cron: "7 8 * * *"

permissions:
  contents: read

jobs:
  mint:
    name: Mint an installation token
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Validity, not presence. levelflow-cloud's secret existed and was not an
      # integer; a mangled PEM fails deep inside the mint as "Invalid keyData".
      # Both are named here, before the stack trace, and neither is printed.
      - name: Check the credential shape
        env:
          APP_ID: ${{ secrets.FLEET_AUTOMERGE_APP_ID }}
          APP_KEY: ${{ secrets.FLEET_AUTOMERGE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error::FLEET_AUTOMERGE_APP_ID and FLEET_AUTOMERGE_PRIVATE_KEY must both be set as Actions secrets on this repo"
            exit 1
          fi
          case "$APP_ID" in
            ''|*[!0-9]*)
              echo "::error::FLEET_AUTOMERGE_APP_ID is not an integer — this is the 401 'iss' failure"
              exit 1 ;;
          esac
          if ! printf '%s' "$APP_KEY" | head -1 | grep -q 'BEGIN .*PRIVATE KEY'; then
            echo "::error::FLEET_AUTOMERGE_PRIVATE_KEY is not a PEM — set it straight from the file, never through a shell variable or the Keychain"
            exit 1
          fi
          lines=$(printf '%s' "$APP_KEY" | wc -l | tr -d ' ')
          if [ "$lines" -lt 3 ]; then
            echo "::error::FLEET_AUTOMERGE_PRIVATE_KEY lost its line breaks ($lines) — a single-line PEM still carries the header and still fails to sign"
            exit 1
          fi
          echo "App ID is an integer; private key is a PEM across $lines lines."

      - name: Mint an installation token
        id: apptoken
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.FLEET_AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.FLEET_AUTOMERGE_PRIVATE_KEY }}
          owner: windwardline

      # What the lane actually needs is that the App reaches each repo. The
      # installation's own repository list answers that directly, and a repo
      # missing from it is the grown-men-grow shape: a lane that will fall back
      # to GITHUB_TOKEN and fail on a Dependabot PR nobody is watching.
      - name: Compare the installation against the fleet
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: |
          set -euo pipefail
          gh api --paginate /installation/repositories \
            --jq '.repositories[].name' | sort -u > covered.txt
          gh api --paginate "users/windwardline/repos?per_page=100" \
            --jq '.[] | select(.archived | not) | select(.is_template | not) | .name' \
            | sort -u > fleet.txt
          covered=$(wc -l < covered.txt | tr -d ' ')
          total=$(wc -l < fleet.txt | tr -d ' ')
          if [ "$covered" -eq 0 ] || [ "$total" -eq 0 ]; then
            echo "::error::enumeration returned nothing ($covered covered, $total repos) — refusing to report a vacuous pass"
            exit 1
          fi
          missing=$(comm -23 fleet.txt covered.txt | tr '\n' ' ')
          echo "Installation covers $covered of $total non-archived repos."
          if [ -n "${missing// /}" ]; then
            echo "::error::the App is not installed on: $missing"
            exit 1
          fi
          echo "Every repo is covered."
