name: Claude review (fleet reusable)

# Called by every fleet repo's claude-review.yml. workflow_call only — this
# never runs in this repo, preserving its documented no-CI status. The gate
# job makes the whole thing activation-ready: reviews run if and only if the
# calling repo carries CLAUDE_CODE_OAUTH_TOKEN (the owner's Max subscription
# license); without it the review is skipped, never failed. Fork PRs never
# receive secrets, so they skip by security design.
#
# API-key billing is fully retired (2026-08-09): the Console key is revoked,
# no repo carries the ANTHROPIC_API_KEY secret, every caller dropped its
# pass-through, and this workflow no longer declares it. The subscription
# license is the only credential.
#
# Credential failures present as: init succeeds on the model, then
# is_error:true on turn one at zero cost — and the action hides SDK output
# even in debug mode, so the real error never reaches CI logs. Replay the
# token locally first (Keychain `anthropic-actions-oauth`, exported as
# CLAUDE_CODE_OAUTH_TOKEN with an isolated $HOME): a dead token returns
# "401 OAuth access token is invalid" in seconds (2026-08-09 precedent).
# Remedy: the owner mints a fresh `claude setup-token`, saves it to that
# Keychain entry, and propagates it to every repo's CLAUDE_CODE_OAUTH_TOKEN
# secret. Nothing in this workflow needs to change for a token rotation.

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "Claude Code OAuth token (subscription license) — the review lane's only credential. Optional: absent means reviews skip cleanly."
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      cred: ${{ steps.k.outputs.cred }}
    steps:
      - id: k
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$OAUTH" ]; then
            cred=oauth
          else
            cred=none
          fi
          echo "cred=$cred" >> "$GITHUB_OUTPUT"
          echo "Review credential: $cred"

  review:
    needs: gate
    if: needs.gate.outputs.cred != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # Credentials must persist (the checkout default): the review action runs
      # its own `git fetch origin --depth=20 <pr-branch>` in this workspace, and
      # without the persisted token that fetch dies on "could not read Username"
      # (every caller repo, 2026-08-09). The token involved is the same ephemeral
      # GITHUB_TOKEN already passed to the action below, so persisting it grants
      # nothing new.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anthropics/claude-code-action@86180fa9e4d311eed10c9cc49854c53dab5d517a # v1.0.184
        with:
          # The gate guarantees this is non-empty whenever this job runs.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The workflow's own token, not the OIDC/GitHub-App exchange — no
          # id-token permission and no app install needed; the declared
          # pull-requests/issues write grants are sufficient for comments.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Without this, the review runs but posts nothing on pull_request
          # events — track_progress creates the PR comment the result lands in.
          track_progress: true
          # Frontier models standing rule (owner-confirmed 2026-08-04): reviews
          # run the current frontier Opus at high effort, like every other
          # client. The tier alias resolves to the newest Opus release
          # automatically — never pin a versioned model ID here. Effort is
          # stated rather than inherited: the runner has no settings.json, so
          # an unset effort silently follows whatever the pinned action's CLI
          # defaults to, and would shift under us on an action bump.
          claude_args: "--model opus --effort high"
          prompt: |
            Review this pull request as the fleet reviewer. Read AGENTS.md (the
            repo operating contract) first and hold the diff against it. Report
            only real findings: contract violations, bugs, security issues,
            silent failures, missing or weakened tests, and docs that should
            have ridden along in this change set. No style nits, no restating
            the diff. If nothing is wrong, say so in one line.

            Do not try to fetch the fleet standard. An earlier version of this
            prompt told you to curl FLEET.md; this sandbox has no network
            egress, so that instruction could never be carried out, and on
            2026-08-20 eight reviewers in one round each spent a turn
            discovering it and correctly refusing to call the check done. An
            order the harness cannot obey is worse than no order — it reads as
            the subject withholding something. It is withdrawn.

            Nor do you need it. Conformance against the fleet standard —
            Preferred-stack deviations and their "Stack exception
            (owner-approved ...)" waiver, the CONVERGE citation, and the cycle
            each repo's AGENTS.md carries — is enforced deterministically by
            scripts/fleet-conformance.sh in windwardline/windwardline, which
            derives what it expects from FLEET.md at run time. That gate binds;
            this review is advisory and explicitly not a required check, so a
            verdict from here could only duplicate a binding answer or
            contradict it. Leave those to the checker.

            Review the diff. That is the part no sweep can do for you.
