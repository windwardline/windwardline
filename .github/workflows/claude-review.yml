name: Claude review (fleet reusable)

# Called by every fleet repo's claude-review.yml. workflow_call only — this
# never runs in this repo, preserving its documented no-CI status. The gate
# job makes the whole thing activation-ready: reviews run if and only if the
# calling repo carries a review credential; without one the review is skipped,
# never failed.
#
# Credentials. Callers pass both; this gate picks exactly one and names it in
# the log, so which credential paid for a given review is always visible.
#
# PREFERENCE IS THE `if` ORDER BELOW — one line, deliberately.
#
# It prefers CLAUDE_CODE_OAUTH_TOKEN (owner's Max subscription). API billing is
# retired: the Console key is revoked and the ANTHROPIC_API_KEY secret is gone
# from every caller repo, so the apikey branch can never activate — it is kept
# only until the callers' pass-through lines are removed in their own change
# sets.
#
# Failure diagnosis (2026-08-09, supersedes the earlier entitlement theory):
# runs fail on turn one at zero cost because the deployed OAuth token itself is
# dead. A local replay of the exact CI credential (Keychain
# `anthropic-actions-oauth`, fingerprint 719c0522 — byte-identical to the repo
# secrets) with the same --model opus --effort high flags returned
# "API Error: 401 OAuth access token is invalid". The action hides SDK output
# even in debug mode, which is why CI logs never showed this. Remedy: the owner
# mints a fresh token (`claude setup-token`), saves it to the Keychain entry
# above, and propagates it to all fourteen repos' CLAUDE_CODE_OAUTH_TOKEN
# secrets. Nothing in this workflow needs to change.

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "Claude Code OAuth token (subscription license). The preferred credential — see header."
        required: false
      ANTHROPIC_API_KEY:
        description: "Console API key. Revoked; dead path pending caller cleanup — see header."
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      cred: ${{ steps.k.outputs.cred }}
    steps:
      - id: k
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIKEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH" ]; then
            cred=oauth
          elif [ -n "$APIKEY" ]; then
            cred=apikey
          else
            cred=none
          fi
          echo "cred=$cred" >> "$GITHUB_OUTPUT"
          echo "Review credential: $cred"

  review:
    needs: gate
    if: needs.gate.outputs.cred != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # Credentials must persist (the checkout default): the review action runs
      # its own `git fetch origin --depth=20 <pr-branch>` in this workspace, and
      # without the persisted token that fetch dies on "could not read Username"
      # (every caller repo, 2026-08-09). The token involved is the same ephemeral
      # GITHUB_TOKEN already passed to the action below, so persisting it grants
      # nothing new.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anthropics/claude-code-action@86180fa9e4d311eed10c9cc49854c53dab5d517a # v1
        with:
          # Exactly one of these is non-empty, decided by the gate — precedence
          # is this workflow's, not the action's internals.
          claude_code_oauth_token: ${{ needs.gate.outputs.cred == 'oauth' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          anthropic_api_key: ${{ needs.gate.outputs.cred == 'apikey' && secrets.ANTHROPIC_API_KEY || '' }}
          # The workflow's own token, not the OIDC/GitHub-App exchange — no
          # id-token permission and no app install needed; the declared
          # pull-requests/issues write grants are sufficient for comments.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Without this, the review runs but posts nothing on pull_request
          # events — track_progress creates the PR comment the result lands in.
          track_progress: true
          # Frontier models standing rule (owner-confirmed 2026-08-04): reviews
          # run the current frontier Opus at high effort, like every other
          # client. The tier alias resolves to the newest Opus release
          # automatically — never pin a versioned model ID here. Effort is
          # stated rather than inherited: the runner has no settings.json, so
          # an unset effort silently follows whatever the pinned action's CLI
          # defaults to, and would shift under us on an action bump.
          claude_args: "--model opus --effort high"
          prompt: |
            Review this pull request as the fleet reviewer. Read AGENTS.md (the
            repo operating contract) first and hold the diff against it. Report
            only real findings: contract violations, bugs, security issues,
            silent failures, missing or weakened tests, and docs that should
            have ridden along in this change set. No style nits, no restating
            the diff. Also fetch the fleet standard
            (curl -s https://raw.githubusercontent.com/windwardline/windwardline/main/FLEET.md)
            and hold the diff against its Preferred stack section: flag any new
            dependency, service, or hosting artifact that deviates without a
            recorded "Stack exception (owner-approved ...)" line in this repo's
            AGENTS.md. If nothing is wrong, say so in one line.
